services:
  postgres:
    image: postgres:16-alpine
    container_name: synchem-sfa-postgres
    environment:
      POSTGRES_USER: sfa
      POSTGRES_PASSWORD: sfa_dev_password
      POSTGRES_DB: synchem_sfa
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sfa -d synchem_sfa']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synchem-sfa-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
